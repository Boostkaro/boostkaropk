<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BoostKaro Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="styles.css">
<link rel="icon" type="image/webp" href="logo.webp">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
/* Admin-only components — styled after the approved API-integration demo:
   white cards (14px radius, soft shadow) with a #0d47a1 "BoostKaroPK Admin"
   head bar, dashed #e3e9f7 row separators, demo badge + button colors. */
.admin-card{background:#fff;border:1px solid #e3e9f7;border-radius:14px;box-shadow:0 6px 24px rgba(20,38,74,.10);overflow:hidden}
.admin-head{background:#0d47a1;color:#fff;padding:12px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px}
.admin-head a{color:#fff;text-decoration:none;font-size:.9rem;font-weight:600}
.admin-head a:hover{text-decoration:underline}
.admin-body{padding:16px}
.admin-body h2{margin:0 0 6px;color:var(--blue-dark);font-size:1.3rem}
.admin-login{max-width:460px;margin:30px auto}
.admin-logout{background:transparent;border:1.5px solid rgba(255,255,255,.65);color:#fff;border-radius:9px;padding:6px 14px;font-size:.85rem;font-weight:700;cursor:pointer}
.admin-logout:hover{background:rgba(255,255,255,.14)}
.admin-filters{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.admin-filters input,.admin-filters select{padding:10px 12px;border:1.5px solid #e3e9f7;border-radius:10px;font-size:.95rem;background:#fff;color:var(--ink)}
.admin-filters input{flex:1;min-width:200px}
.admin-filters input:focus,.admin-filters select:focus{outline:2px solid var(--brand);border-color:var(--brand)}
.admin-filters .btn{border-radius:9px}
.orders-table-wrap{overflow-x:auto}
table.orders{width:100%;border-collapse:collapse;font-size:.9rem}
table.orders th{text-align:left;padding:10px;background:#eef2fb;border-bottom:2px solid #e3e9f7;color:var(--blue-dark);white-space:nowrap;font-size:.8rem;letter-spacing:.6px;text-transform:uppercase}
table.orders td{padding:10px;border-bottom:1px dashed #e3e9f7;vertical-align:top}
table.orders tr:hover td{background:#fafbff}
table.orders select,table.orders input{padding:7px 9px;border:1.5px solid #e3e9f7;border-radius:9px;font-size:.88rem;background:#fff;color:var(--ink)}
table.orders select:focus,table.orders input:focus{outline:2px solid var(--brand);border-color:var(--brand)}
table.orders .btn{border-radius:9px}
.btn-paid{background:#16a34a!important;color:#fff!important;margin-top:8px;padding:9px 14px;font-size:.88rem;font-weight:700;border-radius:9px}
.btn-reject{background:#dc2626!important;color:#fff!important;margin:8px 0 0 6px;padding:9px 14px;font-size:.88rem;font-weight:700;border-radius:9px}
.admin-foot{margin-top:44px;background:linear-gradient(160deg,#103a75,var(--blue-dark) 45%,#081c38);color:#b9cdf3}
.admin-foot .wrap{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:16px 18px;font-size:.86rem}
@media(max-width:640px){
  .admin-body{padding:14px}
  .admin-login{margin:18px auto}
  table.orders{font-size:.85rem}
  table.orders th,table.orders td{padding:8px}
}
</style>
</head>
<body>

<main class="wrap">

  <!-- Login gate -->
  <div id="admin-login" class="admin-card admin-login">
    <div class="admin-head"><span>🚀 BoostKaroPK Admin</span><a href="index.html">← Storefront</a></div>
    <div class="admin-body">
      <h2>Admin Login 🔐</h2>
      <p class="muted">Sign in with your admin account to view and manage orders.</p>
      <div class="field">
        <label for="admin-email">Email</label>
        <input type="email" id="admin-email" autocomplete="username" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="admin-pass">Password</label>
        <input type="password" id="admin-pass" autocomplete="current-password">
      </div>
      <div id="login-error"></div>
      <button class="btn block" id="login-btn" type="button">Login</button>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="admin-panel" style="display:none">
    <div class="admin-card" style="margin-top:26px">
      <div class="admin-head"><span>🚀 BoostKaroPK Admin</span><button class="admin-logout" id="logout-btn" type="button">Logout</button></div>
      <div class="admin-body">
        <h2>Orders 📦 <span class="muted" id="orders-count"></span></h2>
        <div class="admin-filters">
          <input type="text" id="filter-text" placeholder="Search code, name, phone, TID…">
          <select id="filter-status">
            <option value="">All statuses</option>
            <option value="pending">Pending</option>
            <option value="processing">Processing</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>
          </select>
          <button class="btn ghost" id="refresh-btn" type="button">↻ Refresh</button>
        </div>
        <div id="admin-msg"></div>
        <div class="orders-table-wrap">
          <table class="orders">
            <thead>
              <tr>
                <th>Order / Date</th>
                <th>Customer</th>
                <th>Service</th>
                <th>Qty / Price</th>
                <th>TID</th>
                <th>Status</th>
                <th>Note</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="orders-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

</main>

<footer class="admin-foot">
  <div class="wrap"><span>BoostKaro Admin — private page.</span><span>© 2026 BoostKaro · boostkaropk.com</span></div>
</footer>

<script src="admin.js"></script>
</body>
</html>
