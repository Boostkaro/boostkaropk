<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BoostKaro Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="styles.css">
<link rel="icon" type="image/webp" href="logo.webp">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
/* Admin-only components (new-design palette) — shared styles.css has no table styles */
.admin-login{max-width:460px;margin:30px auto}
.admin-filters{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.admin-filters input,.admin-filters select{padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:.95rem;background:#fff;color:var(--ink)}
.admin-filters input{flex:1;min-width:200px}
.admin-filters input:focus,.admin-filters select:focus{outline:2px solid var(--brand);border-color:var(--brand)}
.orders-table-wrap{overflow-x:auto}
table.orders{width:100%;border-collapse:collapse;font-size:.9rem}
table.orders th{text-align:left;padding:10px;border-bottom:2px solid var(--line);color:var(--blue-dark);white-space:nowrap;font-size:.8rem;letter-spacing:.6px;text-transform:uppercase}
table.orders td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
table.orders tr:hover td{background:#f8faff}
table.orders select,table.orders input{padding:7px 9px;border:1.5px solid var(--line);border-radius:8px;font-size:.88rem;background:#fff;color:var(--ink)}
.btn-paid{background:#16a34a!important;color:#fff!important;margin-top:6px;padding:6px 12px;font-size:.85rem}
.btn-reject{background:#dc2626!important;color:#fff!important;margin:6px 0 0 6px;padding:6px 12px;font-size:.85rem}
.admin-foot{margin-top:44px;background:linear-gradient(160deg,#103a75,var(--blue-dark) 45%,#081c38);color:#b9cdf3}
.admin-foot .wrap{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:16px 18px;font-size:.86rem}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a class="logo" href="index.html">Boost<span>Karo</span><b>.</b> <small style="font-weight:600;font-size:.95rem;color:var(--muted)">Admin</small></a>
    <nav class="main">
      <a href="index.html">← Storefront</a>
    </nav>
  </div>
</header>

<main class="wrap">

  <!-- Login gate -->
  <div id="admin-login" class="section admin-login">
    <h2>Admin Login 🔐</h2>
    <p class="muted">Sign in with your admin account to view and manage orders.</p>
    <div class="field">
      <label for="admin-email">Email</label>
      <input type="email" id="admin-email" autocomplete="username" placeholder="you@example.com">
    </div>
    <div class="field">
      <label for="admin-pass">Password</label>
      <input type="password" id="admin-pass" autocomplete="current-password">
    </div>
    <div id="login-error"></div>
    <button class="btn block" id="login-btn" type="button">Login</button>
  </div>

  <!-- Dashboard -->
  <div id="admin-panel" style="display:none">
    <section class="section" style="margin-top:26px">
      <h2>Orders 📦 <span class="muted" id="orders-count"></span> <button class="btn" id="logout-btn" type="button" style="float:right;font-size:13px;padding:6px 12px;">Logout</button></h2>
      <div class="admin-filters">
        <input type="text" id="filter-text" placeholder="Search code, name, phone, TID…">
        <select id="filter-status">
          <option value="">All statuses</option>
          <option value="pending">Pending</option>
          <option value="processing">Processing</option>
          <option value="completed">Completed</option>
          <option value="cancelled">Cancelled</option>
        </select>
        <button class="btn ghost" id="refresh-btn" type="button">↻ Refresh</button>
      </div>
      <div id="admin-msg"></div>
      <div class="orders-table-wrap">
        <table class="orders">
          <thead>
            <tr>
              <th>Order / Date</th>
              <th>Customer</th>
              <th>Service</th>
              <th>Qty / Price</th>
              <th>TID</th>
              <th>Status</th>
              <th>Note</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="orders-body"></tbody>
        </table>
      </div>
    </section>
  </div>

</main>

<footer class="admin-foot">
  <div class="wrap"><span>BoostKaro Admin — private page.</span><span>© 2026 BoostKaro · boostkaropk.com</span></div>
</footer>

<script src="admin.js"></script>
</body>
</html>
