<style>
/* Tracking page components — BoostKaro palette, layout per Raji's reference design */
.track-brand{background:#0d47a1;color:#fff;padding:12px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.track-brand a{color:#fff;text-decoration:none;font-size:.9rem;font-weight:600}
.track-card{max-width:560px;margin:26px auto;background:#fff;border-radius:14px;box-shadow:0 6px 24px rgba(20,38,74,.10);overflow:hidden}
.track-body{padding:18px}
.track-body h2{margin:0 0 6px;color:var(--blue-dark)}
.badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.b-pending{background:#fff3cd;color:#8a6d00}
.b-paid{background:#e0e7ff;color:#3730a3}
.b-inprog{background:#dbeafe;color:#1d4ed8}
.b-done{background:#d1fae5;color:#047857}
.b-cancel{background:#fee2e2;color:#b91c1c}
#track-result .ord{border-top:1px solid #e3e9f7;margin-top:18px;padding-top:16px}
.ord-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ord-head b{font-size:17px;color:#14264a}
.svc-row{display:flex;gap:12px;align-items:center;margin-top:14px}
.svc-ic{width:52px;height:52px;border-radius:14px;background:#eef2fb;display:flex;align-items:center;justify-content:center;flex:none}
.svc-name{font-weight:700;font-size:15px;color:#14264a}
.svc-sub{font-size:13px;color:#66779e;margin-top:2px}
.ord-date{margin-top:12px;font-size:12.5px;color:#66779e}
.tl{margin-top:6px}
.tl-item{display:flex;gap:12px;padding:10px 0;position:relative}
.tl-item:not(:last-child)::before{content:"";position:absolute;left:11px;top:38px;bottom:-4px;width:2px;background:#e3e9f7}
.tl-item.done:not(:last-child)::before{background:#16a34a}
.dot{width:24px;height:24px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;background:#c7d2e8;position:relative;z-index:1}
.tl-item.done .dot{background:#16a34a}
.tl-item.now .dot{background:#16a34a}
.tl-item.next .dot{background:#1a73e8}
.tl-item.now:not(:last-child)::before{background:#16a34a}
.tl-item .t{font-weight:600;font-size:14px;color:#14264a}
.tl-item.todo .t{color:#8fa1c2}
.tl-item .s{font-size:12px;color:#66779e;margin-top:1px}
.delivered{background:#d1fae5;color:#065f46;border-radius:9px;padding:10px 12px;font-size:13.5px;margin-top:12px;font-weight:600}
.delivered .ck{display:inline-flex;width:20px;height:20px;border-radius:50%;background:#16a34a;color:#fff;align-items:center;justify-content:center;font-size:12px;margin-right:6px;vertical-align:-4px}
.cancelled-note{background:#fee2e2;color:#7f1d1d;border-radius:9px;padding:10px 12px;font-size:13.5px;margin-top:10px;font-weight:600}
</style>
</head>
<body>

<main class="wrap">
  <div class="track-card">
    <div class="track-brand"><span>🚀 BoostKaroPK</span><a href="/">← Back to Store</a></div>
    <div class="track-body">
      <h2>Track Your Order 🔍</h2>
      <p class="muted">Enter the order code from your confirmation and the contact number you ordered with.</p>
      <div class="field">
        <label for="track-code">Order Code <span class="req">*</span></label>
        <input type="text" id="track-code" placeholder="BK-XXXX" autocomplete="off">
      </div>
      <div class="field">
        <label for="track-phone">Contact Number <span class="req">*</span></label>
        <input type="text" id="track-phone" placeholder="03XXXXXXXXX" autocomplete="off">
      </div>
      <button class="btn block" id="track-btn" type="button">Check Status</button>
      <div id="track-result" style="margin-top:16px"></div>
    </div>
  </div>
</main>

<footer class="admin-foot" style="margin-top:44px;background:linear-gradient(160deg,#103a75,var(--blue-dark) 45%,#081c38);color:#b9cdf3">
  <div class="wrap" style="display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:16px 18px;font-size:.86rem"><span>BoostKaro — Pakistan's affordable SMM panel.</span><span>© 2026 BoostKaro · boostkaropk.com</span></div>
</footer>

    tiktok: '<svg viewBox="0 0 24 24" width="26" height="26" aria-label="TikTok"><path fill="#000" d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>',
    facebook: '<svg viewBox="0 0 24 24" width="26" height="26" aria-label="Facebook"><path fill="#1877F2" d="M9.101 23.691v-7.98H6.627v-3.667h2.474v-1.58c0-4.085 1.848-5.978 5.858-5.978.401 0 .955.042 1.468.103a8.68 8.68 0 0 1 1.141.195v3.325a8.623 8.623 0 0 0-.653-.036 26.805 26.805 0 0 0-.733-.009c-.707 0-1.259.096-1.675.309a1.686 1.686 0 0 0-.679.622c-.258.42-.374.995-.374 1.752v1.297h3.919l-.386 2.103-.287 1.564h-3.246v8.245C19.396 23.238 24 18.179 24 12.044c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.628 3.874 10.35 9.101 11.647Z"/></svg>',
    youtube: '<svg viewBox="0 0 24 24" width="28" height="28" aria-label="YouTube"><path fill="#FF0000" d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>'
  };

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  // GA4: track_lookup_result (Group B2, 2026-10-25) - result and coarse
  // stage only; never the order code, contact number or order details.
  var TRACK_STAGES = { pending: "payment_pending", paid: "confirmed", processing: "in_progress", completed: "completed", cancelled: "cancelled", rejected: "cancelled" };
  function gaTrack(result, stage) {
    if (typeof gtag !== "function") return;
    var info = { result: result };
    if (stage) info.order_stage = stage;
    gtag("event", "track_lookup_result", info);
  }
  function fmtDT(iso) {
    var d = new Date(iso);
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) +
      " - " + d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
  }
  function step(state, title, sub) {
    var dot = state === "done" ? "✓" : ((state === "now" || state === "next") ? "●" : "");
    return '<div class="tl-item ' + state + '"><div class="dot">' + dot + '</div><div>' +
      '<div class="t">' + title + '</div><div class="s">' + sub + "</div></div></div>";
  }
  // Map the provider's own status text (once the bridge writes it) to a stage.
  function providerState(ps) {
    if (!ps) return "";
    var s = String(ps).toLowerCase();
    if (s.indexOf("cancel") >= 0) return "cancelled";
    if (s.indexOf("complet") >= 0 || s.indexOf("partial") >= 0) return "completed";
    if (s.indexOf("progress") >= 0 || s.indexOf("processing") >= 0) return "processing";
    if (s.indexOf("pending") >= 0) return "providerPending";
    return "";
  }

  function render(o) {
    var svcName = (PLATFORM[o.platform] || o.platform) + " " + (SERVICE[o.service_type] || o.service_type);
    var typeLabel = SERVICE[o.service_type] || o.service_type;
    var icon = ICON[o.platform] || "📦";
    var ps = providerState(o.provider_status);
    var eff = ps || o.status;

    var badge;
    if (eff === "cancelled") badge = '<span class="badge b-cancel">Cancelled</span>';
    else if (eff === "completed") badge = '<span class="badge b-done">Completed</span>';
    else if (eff === "providerPending") badge = '<span class="badge b-pending">Pending</span>';
    else if (o.status === "pending") badge = '<span class="badge b-pending">Pending Payment</span>';
    else if (o.status === "paid") badge = '<span class="badge b-paid">Payment Confirmed</span>';
    else badge = '<span class="badge b-inprog">In Progress</span>';

    var html = '<div class="ord">';
    html += '<div class="ord-head"><b>Order #' + esc(o.order_code) + "</b>" + badge + "</div>";
    html += '<div class="svc-row"><div class="svc-ic">' + icon + '</div><div>' +
      '<div class="svc-name">' + esc(svcName) + "</div>" +
      '<div class="svc-sub">' + Number(o.quantity).toLocaleString() + " " + esc(typeLabel) +
      (o.quality ? " · " + esc(o.quality) : "") + "</div></div></div>";
    html += '<div class="ord-date">Order Date: ' + esc(fmtDT(o.created_at)) + "</div>";

    var tl = '<div class="tl">';
    var tail = "";
    if (eff === "cancelled") {
      tl += '<div class="tl-item"><div class="dot">✕</div><div>' +
        '<div class="t">Order Cancelled</div><div class="s">This order is no longer active.</div></div></div>';
      tail = '<div class="cancelled-note">If you believe this is a mistake, message us on WhatsApp and we\'ll help right away.</div>';
    } else {
      // Step 1 — Payment Confirmed: done once Raji has confirmed payment.
      if (o.status === "pending" && !ps) {
        tl += step("next", "Payment Confirmed", "We're verifying your payment — this usually takes a short while.");
      } else {
        tl += step("done", "Payment Confirmed", "Payment received and confirmed.");
      }
      // Step 2 — Pending: the order has been sent and is pending at the provider.
      if (ps === "providerPending") {
        tl += step("now", "Pending", "Your order has been sent and is waiting to start.");
      } else if (ps === "processing" || ps === "completed" || o.status === "processing" || o.status === "completed") {
        tl += step("done", "Pending", "Your order was sent for delivery.");
      } else if (o.status === "paid") {
        tl += step("next", "Pending", "Queued — your order will be sent for delivery shortly.");
      } else {
        tl += step("todo", "Pending", "Starts after your payment is confirmed.");
      }
      // Step 3 — Processing: the provider is delivering.
      if (eff === "completed") {
        tl += step("done", "In Progress", "Your order was processed by our team.");
      } else if (ps === "processing" || (!ps && o.status === "processing")) {
        tl += step("now", "In Progress", "Your order is being delivered.");
      } else if (ps === "providerPending") {
        tl += step("next", "In Progress", "Starts once your order begins processing.");
      } else {
        tl += step("todo", "In Progress", "Starts after the pending stage.");
      }
      // Step 4 — Completed.
      if (eff === "completed") {
        tl += step("done", "Completed", esc(fmtDT(o.updated_at || o.created_at)));
        tail = '<div class="delivered"><span class="ck">✓</span>Your order has been delivered successfully!</div>';
      } else if (ps === "processing" || (!ps && o.status === "processing")) {
        tl += step("next", "Completed", "Waiting for delivery…");
      } else {
        tl += step("todo", "Completed", "Waiting for delivery…");
      }
    }
    tl += "</div>";
    return html + tl + tail + "</div>";
  }

  function lookup() {
    var out = $("track-result");
    var code = $("track-code").value.trim().toUpperCase();
    var phone = $("track-phone").value.trim();
    if (!code || !phone) {
      out.innerHTML = '<div class="alert error">Enter both your order code and contact number.</div>';
      return;
    }
    if (!sb) {
      out.innerHTML = '<div class="alert error">Database not connected. Please try again later.</div>';
      return;
    }
    out.innerHTML = '<p class="muted">Looking up your order…</p>';
    function handle(res) {
      if (res.error) {
        gaTrack("error");
        out.innerHTML = '<div class="alert error">Lookup failed. Please try again.</div>';
        return;
      }
      if (!res.data || !res.data.length) {
        gaTrack("not_found");
        out.innerHTML = '<div class="alert error">No order found. Check your code and contact number.</div>';
        return;
      }
      gaTrack("found", TRACK_STAGES[res.data[0].status] || "found");
      out.innerHTML = render(res.data[0]);
    }
    // Privacy fix: the orders table is no longer publicly readable. The
    // track_order function returns display-safe fields for the single
    // order whose code AND contact number both match — and nothing else.
    sb.rpc("track_order", { p_code: code, p_contact: phone })
      .then(handle)
      .catch(function () {
        gaTrack("error");
        out.innerHTML = '<div class="alert error">Lookup failed. Please try again.</div>';
      });
  }

  document.addEventListener("DOMContentLoaded", function () {
    $("track-btn").addEventListener("click", lookup);
    $("track-phone").addEventListener("keydown", function (e) { if (e.key === "Enter") lookup(); });
    var pre = new URLSearchParams(window.location.search).get("code");
    if (pre) $("track-code").value = pre.toUpperCase();
  });
})();
</script>
</body>
